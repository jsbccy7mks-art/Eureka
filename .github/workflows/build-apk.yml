name: Build APK

on:
  push:
    branches: [ main, master, dev ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Secrets pasted on a phone can pick up invisible characters, so keep only the characters
      # the key and password can actually contain.
      - name: Restore signing key
        env:
          KEY_B64: ${{ secrets.ZAPP_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.ZAPP_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEY_B64" ]; then
            printf "%s" "$KEY_B64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > zapp.keystore
            CLEAN_PASSWORD=$(printf "%s" "$KEY_PASSWORD" | tr -cd 'A-Za-z0-9')
            echo "::add-mask::$CLEAN_PASSWORD"
            echo "ZAPP_KEYSTORE_PASSWORD=$CLEAN_PASSWORD" >> "$GITHUB_ENV"
            echo "Signing with the permanent Zapp key."
          else
            echo "::warning::No ZAPP_KEYSTORE_B64 secret: this APK can't update earlier installs."
          fi

      - name: Bundle the changelog (shown in the app after an update)
        run: cp CHANGELOG.md app/src/main/assets/changelog.md

      - name: Run tests
        run: gradle testReleaseUnitTest --no-daemon

      - name: Build APK
        env:
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk zapp-tv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: zapp-tv-apk
          path: zapp-tv.apk

      # Publishes every successful build as a release, so the newest APK is always at:
      # https://github.com/<owner>/<repo>/releases/latest/download/zapp-tv.apk
      # Only main publishes an update; dev builds are compile-and-test checks.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          # This version's section of the changelog, then where it was built from.
          awk '/^## /{n++} n==1' CHANGELOG.md > notes.md
          echo "" >> notes.md
          echo "Built from ${GITHUB_SHA::7}. Install on your TV with the Downloader app." >> notes.md
          gh release create "$TAG" zapp-tv.apk \
            --title "Zapp TV build ${{ github.run_number }}" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            --latest
