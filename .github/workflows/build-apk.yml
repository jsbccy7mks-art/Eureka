name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Restore signing key
        env:
          KEY_B64: ${{ secrets.ZAPP_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > zapp.keystore
            echo "Signing with the permanent Zapp key."
          else
            echo "::warning::No ZAPP_KEYSTORE_B64 secret: this APK can't update earlier installs."
          fi

      - name: Run tests
        run: gradle testReleaseUnitTest --no-daemon

      - name: Build APK
        env:
          ZAPP_KEYSTORE_PASSWORD: ${{ secrets.ZAPP_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk zapp-tv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: zapp-tv-apk
          path: zapp-tv.apk

      # Publishes every successful build as a release, so the newest APK is always at:
      # https://github.com/<owner>/<repo>/releases/latest/download/zapp-tv.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" zapp-tv.apk \
            --title "Zapp TV build ${{ github.run_number }}" \
            --notes "Built from ${GITHUB_SHA::7}. Install on your TV with the Downloader app." \
            --target "$GITHUB_SHA" \
            --latest
